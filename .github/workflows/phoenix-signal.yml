name: PHOENIX Live Signal

on:
  schedule:
    # Run at 6:30 PM ET (23:30 UTC) every weekday (30 min after market close)
    - cron: '30 23 * * 1-5'
  workflow_dispatch:  # allow manual trigger

permissions:
  contents: write

# Never run two refreshes at once (cron + manual dispatch would race on the
# same CSVs and the push step); don't cancel a running refresh mid-commit.
concurrency:
  group: phoenix-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install pandas numpy yfinance requests xgboost scikit-learn

    - name: Full PHOENIX refresh
      env:
        FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        PYTHONUNBUFFERED: '1'
      run: |
        python alt/refresh_all.py

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add data/etfs/ data/fred/ data/results/ docs/phoenix.html
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "PHOENIX refresh: $(date -u +%Y-%m-%d)"
          # Rebase before push so a race with daily-update.yml doesn't drop
          # this run's state; retry on transient errors. If every attempt
          # fails, FAIL the job (the old loop ended on `sleep` and exited 0,
          # silently dropping the day's state).
          pushed=0
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || git rebase --abort || true
            if git push; then pushed=1; break; fi
            echo "Push attempt $i failed, retrying..."
            sleep $((i*2))
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::All push attempts failed — state not persisted"
            exit 1
          fi
        fi
